<div class="app"><header class="topbar"><div id="breadcrumb" class="breadcrumb">Arena / <strong>Overview</strong></div><div class="header-tools"><span class="paper-label">PAPER INVESTING</span><details id="freshness" class="freshness"><summary id="meta" title="Saved portfolio timestamp. Open for price observations and data details.">Loading portfolios…</summary><div class="freshness-panel" id="freshness-panel"></div></details></div></header>
<main class="main" id="main"><p id="error" class="notice" role="alert"></p><div id="content" aria-live="off"><p class="empty-state">Loading portfolios…</p></div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const present=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
const money=v=>present(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)):'Unavailable';
const pct=v=>present(v)?Number(v).toFixed(3)+'%':'Unavailable';
const tone=v=>present(v)?(Number(v)<0?'negative':Number(v)>0?'positive':''):'';
const when=v=>v&&Number.isFinite(Date.parse(v))?new Date(v).toLocaleString('en-US',{timeZoneName:'short'}):'Unavailable';
const list=v=>Array.isArray(v)?v:[];
const labels={fresh:'Recent price',cash_only:'Cash only',market_closed:'Market closed · latest close',stale:'Stale / cached price',unavailable:'Valuation unavailable',not_started:'Not started',account_error:'Account error',account_changed:'Account changed · retry',no_change:'No change',rebalance:'Rebalance',PASS_WITH_WARNINGS:'Passed with warnings',PASS:'Passed',FAIL:'Failed',reconciled:'Reconciled',verified:'Hash verified'};
const label=v=>labels[v]||String(v??'Unavailable').replaceAll('_',' ');
const policies={next_regular_session_open:'Next regular-session open',first_fresh_observed_completed_minute_close:'First fresh completed-minute close',fresh_reference_price_ledger:'Direct Python ledger · fresh reference price'};
const policy=v=>policies[v]||label(v);
function link(url,title){if(typeof url!=='string'||!url||/[\u0000-\u0020\\]/.test(url))return '';return !/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(url)||/^https?:\/\//i.test(url)?'<a href="'+esc(url)+'">'+esc(title)+'</a>':'';}
function badge(status){return `<span class="badge ${['stale','unavailable','account_error','account_changed'].includes(status)?'warn':status==='not_started'?'idle':''}">${esc(label(status))}</span>`}
function artifact(url,title,status){return link(url,title)||`<span class="missing">${esc(title)}: unavailable${status?' ('+esc(label(status))+')':''}</span>`}
function decision(d,x,key){return `<div class="decision"><h4>${d.action==='no_change'?'Keep current allocation':'Recorded allocation rationale'}</h4><p class="rationale">${esc(d.rationale||'Recorded rationale unavailable.')}</p><div class="decision-meta"><span>Decision sealed: ${esc(when(d.sealed_at))}</span><span>Evidence cutoff: ${esc(when(d.evidence_cutoff))}</span></div><code class="decision-id">${esc(d.decision_id||'Decision ID unavailable')}</code><nav class="evidence-links" aria-label="Decision evidence">${link(d.reading_url,'Read decision report')}${artifact(d.record_url,'Investment decision (JSON)')}${artifact(d.report_url,'Sealed report (JSON)',d.report_status)}${artifact(d.evidence_url,'Decision evidence (JSON)',d.evidence_status)}${link(x.account_url,'Execution ledger (JSON)')}</nav>${list(d.execution_changes).map(c=>`<div class="amendment"><h4>Execution timing amendment</h4><p>${esc(policy(c.old_policy))} → ${esc(policy(c.new_policy))}</p><p>${esc(c.note||'Recorded execution timing changed.')}</p><p class="muted">Amended: ${esc(when(c.at))} · Paper execution proxy</p></div>`).join('')}<details data-key="${esc(key)}"><summary>Decision details and review</summary><p>Action: ${esc(label(d.action))} · Decision: ${esc(label(d.status))} · Review: ${esc(label(d.review_status))}</p>${d.target_weights&&Object.keys(d.target_weights).length?`<p>Recorded target weights: ${Object.entries(d.target_weights).map(([symbol,weight])=>`${esc(symbol)} ${present(weight)?(Number(weight)*100).toFixed(2)+'%':'Unavailable'}`).join(' · ')}</p>`:''}${list(d.warnings).map(w=>`<p class="notice">${esc(w)}</p>`).join('')}${list(d.execution_changes).filter(c=>c.authorization).map(c=>`<p>Timing authorization: ${esc(c.authorization)}</p>`).join('')}<p class="muted">Decision report and evidence links refer to the hash-verified JSON artifacts recorded for this decision. Review status describes the recorded review; it does not guarantee source accuracy.</p><details data-key="${esc(key)}-raw"><summary>Complete decision metadata and artifact checks</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details></details></div>`}
function holding(p,x){const ids=list(p.decision_ids),decisions=list(x.decisions),matched=ids.map(id=>decisions.find(d=>d.decision_id===id)).filter(Boolean),missing=ids.filter(id=>!decisions.some(d=>d.decision_id===id)),fills=list(x.trades).filter(t=>t.symbol===p.symbol),lastFill=fills.reduce((last,t)=>!last||Date.parse(t.filled_at)>Date.parse(last.filled_at)?t:last,null),costOK=p.cost_basis_status==='reconciled',prefix=x.expert_id+'-'+p.symbol;return `<article class="holding" aria-label="${esc(p.symbol)} holding"><div class="top holding-head"><h3>${esc(p.symbol)}</h3><span class="muted">${esc(p.shares??'Unavailable')} shares</span></div><div class="holding-values"><dl class="value-pair"><dt>Avg. buy price (fill)</dt><dd class="${!costOK?'unavailable':''}">${money(costOK?p.average_buy_price:null)}</dd><dt>Cost basis (incl. fees)</dt><dd class="${!costOK?'unavailable':''}">${money(costOK?p.cost_basis:null)}</dd></dl><dl class="value-pair"><dt>Latest market price</dt><dd>${money(p.price)}<span class="quote-time">Completed-minute close<br>${esc(when(p.price_as_of))}<br>${badge(p.status)}</span></dd><dt>Market value</dt><dd>${money(p.market_value)}</dd></dl><dl class="value-pair"><dt>Unrealized P/L</dt><dd class="${tone(costOK?p.unrealized_profit_loss:null)} ${!costOK?'unavailable':''}">${money(costOK?p.unrealized_profit_loss:null)}</dd><dt>Unrealized return</dt><dd class="${tone(costOK?p.unrealized_return_pct:null)} ${!costOK?'unavailable':''}">${pct(costOK?p.unrealized_return_pct:null)}</dd></dl></div>${!costOK?`<p class="notice holding-note">Cost basis unavailable: ${esc(p.cost_basis_error||'Acquisition history has not been reconciled.')}</p>`:''}<p class="muted holding-note">Last paper fill: ${esc(when(lastFill?.filled_at))}</p>${matched.map(d=>decision(d,x,prefix+'-'+d.decision_id)).join('')}${missing.map(id=>`<div class="decision"><h4>Why this holding?</h4><p class="muted">The recorded decision is unavailable for <code>${esc(id)}</code>.</p></div>`).join('')}${!ids.length?'<div class="decision"><h4>Why this holding?</h4><p class="muted">No decision link is available in the acquisition history.</p></div>':''}<div class="decision"><details data-key="${esc(prefix)}-fills"><summary>Paper fills for ${esc(p.symbol)} (${fills.length})</summary>${fills.length?`<ul class="fill-list">${fills.map(t=>`<li>${esc(label(t.side))} ${esc(t.shares??'Unavailable')} shares at ${money(t.fill_price)} · Fees ${money(t.fees)}<small>Fill time: ${esc(when(t.filled_at))}</small><code>${esc(t.decision_id||'Decision ID unavailable')}</code></li>`).join('')}</ul>`:'<p class="muted">No paper fills are available.</p>'}<p class="muted">Recorded fills include simulated execution slippage. All fills shown here are for this symbol, including any shares subsequently sold.</p></details></div></article>`}

 return (expert?'<div class="section-line"><div><h2>Research library</h2><small>Reports remain tied to their recorded research.</small></div><span class="inline-link">'+link(expert.report_url,'Latest report ↗')+'</span></div>':pageHead('Research','A dated library of each expert’s work.'))+
 '<div class="toolbar">'+searchControl('Search reports')+(expert?'':ownerControl(rows))+selectControl('filter','Filter research',[['all','All reports'],['readable','Readable reports'],['sealed','Decision research'],['attempt','Research attempts']])+selectControl('period','Filter time period',[['all','All time'],['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days']])+'<span class="result-count">'+reports.length+' reports</span></div>'+
 (p.items.length?'<div class="table-wrap"><table><thead><tr><th>Report</th>'+(expert?'':'<th>Expert</th>')+'<th>Recorded</th><th>Status</th><th>Open</th></tr></thead><tbody>'+p.items.map(r=>'<tr><td><span class="report-title">'+esc(r.title||'Research report')+'</span><span class="subline">'+esc(r.source==='sealed_decision'?'Decision research':r.source==='research_attempt'?'Research attempt':'Latest available report')+'</span><details data-key="research-'+esc(r.expert.expert_id+'-'+r.research_id)+'"><summary>Record details</summary><p class="subline">Research ID: '+esc(r.research_id)+'<br>Decision ID: '+esc(r.decision_id||'No linked decision')+'</p><p class="subline">'+link(r.artifact_url,r.source==='sealed_decision'?'Sealed report (JSON)':'Report artifact (JSON)')+'</p><pre>'+esc(JSON.stringify({...r,expert:undefined},null,2))+'</pre></details></td>'+(expert?'':'<td><a href="'+expertURL(r.expert.expert_id,'research')+'">'+esc(r.expert.name)+'</a></td>')+'<td class="num" title="'+esc(when(r.at))+'">'+esc(shortWhen(r.at))+'<span class="subline">'+esc(r.timestamp_basis==='decision_sealed_at'||r.source==='sealed_decision'?'Decision sealed':'Attempt recorded')+'</span></td><td class="report-status">'+statePill({key:['blocked','failed','FAIL'].includes(r.status)?'attention':r.status==='latest_available'?'waiting':'complete',text:r.source==='research_attempt'&&r.status==='blocked'?'Blocked attempt':r.source==='research_attempt'&&r.status==='failed'?'Failed attempt':label(r.status)})+'</td><td class="inline-link">'+reportLink(r)+'</td></tr>').join('')+'</tbody></table></div>':empty('No matching research','Try another report, expert, or time period.'))+pagination(p,'reports');
}

function holdings(x){
 const positions=list(x.positions),pending=list(x.decisions).find(d=>d.decision_id===x.pending_decision_id);
 return '<div class="summary-strip"><div class="summary-stat"><span>Account value</span><strong>'+money(x.total_value)+'</strong><small>'+esc(label(x.status))+'</small></div><div class="summary-stat"><span>Cash</span><strong>'+money(x.cash)+'</strong><small>Available paper cash</small></div><div class="summary-stat"><span>Holdings value</span><strong>'+money(x.holdings_value)+'</strong><small>'+positions.length+' securities</small></div><div class="summary-stat"><span>P/L since funding</span><strong class="'+tone(x.profit_loss)+'">'+money(x.profit_loss)+'</strong><small class="'+tone(x.return_pct)+'">'+pct(x.return_pct)+'</small></div></div>'+
 '<p class="summary-copy">'+esc(safeSummary(x))+'</p>'+
 (x.pending_intent_id?'<div class="notice"><strong>Awaiting paper trade</strong><p>An approved plan is waiting for a recorded fill. Target allocations are not current holdings.</p>'+(pending?'<a href="'+expertURL(x.expert_id,'decisions')+'">View the approved decision</a>':'Decision details are unavailable.')+'</div>':'')+
 '<div class="section-line"><h2>Current holdings <span class="muted">· '+positions.length+'</span></h2><small>Valuation '+esc(shortWhen(x.valuation_as_of))+'</small></div>'+
 (positions.length?'<div class="table-wrap"><table class="holdings-table"><thead><tr><th>Security</th><th class="num">Shares</th><th class="num">Avg. buy price</th><th class="num">Latest market price</th><th class="num">Market value</th><th class="num">Unrealized P/L</th><th>Decision</th></tr></thead><tbody>'+positions.map(p=>{const reconciled=p.cost_basis_status==='reconciled',key=x.expert_id+'-'+p.symbol+'-holding';return '<tr><td><strong>'+esc(p.symbol)+'</strong><span class="subline">'+esc(label(p.status))+'</span></td><td class="num">'+esc(p.shares??'Unavailable')+'</td><td class="num">'+money(reconciled?p.average_buy_price:null)+'<span class="subline">Paper fill average</span></td><td class="num">'+money(p.price)+'<span class="subline" title="'+esc(when(p.price_as_of))+'">'+esc(shortWhen(p.price_as_of))+'</span></td><td class="num">'+money(p.market_value)+'</td><td class="num '+tone(reconciled?p.unrealized_profit_loss:null)+'">'+money(reconciled?p.unrealized_profit_loss:null)+'<span class="subline">'+pct(reconciled?p.unrealized_return_pct:null)+'</span></td><td><button class="why-button" data-holding="'+esc(key)+'" aria-expanded="'+openDetails.has(key)+'" aria-controls="'+esc(key)+'">Why '+esc(p.symbol)+'? <span aria-hidden="true">⌄</span></button></td></tr><tr class="holding-detail"><td colspan="7"><details id="'+esc(key)+'" data-key="'+esc(key)+'"><summary>Holding detail for '+esc(p.symbol)+'</summary>'+holding(p,x)+'</details></td></tr>';}).join('')+'</tbody></table></div>':empty(x.status==='not_started'?'This account has not started':'No securities held',x.status==='not_started'?'Holdings will appear after a paper account is funded.':'The account currently has no stock or ETF positions. Review Decisions for the recorded reasoning.'))+
 '<p class="table-note">Average buy prices include simulated slippage. Cost basis includes fees. Latest prices are completed-minute market observations, with their own timestamps; they are not executable quotes.</p>'+
 '<p class="footnote">P/L is since this account’s funding. No historical return series is available here.</p>';
}
function audit(x){
 const s=scheduleFor(x);
 return '<details class="audit" data-key="'+esc(x.expert_id)+'-audit"><summary>Audit details · account, evidence &amp; saved research state</summary><p>Full rationale and decision reviews are available in Decisions and each holding’s acquisition detail. Review status describes the recorded review; it does not guarantee source accuracy.</p>'+
 list(x.warnings).map(w=>'<p class="notice">'+esc(w)+'</p>').join('')+
 '<p>Research note: '+esc(x.research_note||'None recorded')+'</p><p>Account revision: '+esc(x.revision??'Unavailable')+' · '+esc(x.fill_count??'Unavailable')+' recorded fills<br>Account saved: '+esc(when(x.account_as_of))+'<br>Last research attempt: '+esc(when(s.last_attempt_at))+'<br>Last completed research: '+esc(when(s.last_successful_research_at))+'</p><nav class="evidence-links">'+link(x.account_url,'Paper execution ledger (JSON)')+link(x.runtime?.schedule_url,'Research schedule (JSON)')+link(x.runtime?.checkpoint_url,'Saved checkpoint (JSON)')+'<a href="portfolio.json">Portfolio snapshot (JSON)</a></nav><p class="muted">Account source fingerprint</p><code>'+esc(x.source?.sha256||'Unavailable')+'</code><details data-key="'+esc(x.expert_id)+'-schedule"><summary>Complete recorded research state</summary><pre>'+esc(JSON.stringify(s,null,2))+'</pre></details><details data-key="'+esc(x.expert_id)+'-account-metadata"><summary>Complete portfolio metadata</summary><pre>'+esc(JSON.stringify(x,null,2))+'</pre></details><p class="muted">Schedule records are historical observations, not a process heartbeat. This page does not start a scheduler or change accounts.</p></details>';
}
function about(x){
 const s=scheduleFor(x),r=researchState(x);
 return '<div class="about-grid"><div><section class="about-section"><h2>Investment method</h2><p>'+esc(x.description||'No method description recorded.')+'</p></section><section class="about-section"><h2>Research cadence</h2><p>'+esc(x.cadence_description||'Not specified')+'</p><p>Next review target: '+esc(when(s.next_review_at))+'. A target date does not confirm that research will run.</p></section><section class="about-section"><h2>Paper investing</h2><p>Each expert has an independent simulated account. Account performance begins at funding; research decisions and recorded fills are separate events.</p><p>Research review does not guarantee source accuracy. Full original rationale, warnings and evidence are retained with each decision.</p></section></div><div class="about-section"><h2>Account &amp; research</h2><dl class="fact-list"><div><dt>Initial funding</dt><dd>'+money(x.initial_capital)+'</dd></div><div><dt>Research</dt><dd>'+esc(r.text)+'</dd></div><div><dt>Recorded at</dt><dd>'+esc(shortWhen(r.at))+'</dd></div><div><dt>Latest decision</dt><dd>'+esc(decisionState(x))+'</dd></div><div><dt>Paper fills</dt><dd>'+esc(x.fill_count??list(x.trades).length)+'</dd></div></dl><p class="footnote">'+link(x.report_url,'Latest research report ↗')+'</p></div></div>'+audit(x);
}
function expertPage(rows){
 const x=rows.find(x=>x.expert_id===route.expert);
 if(!x)return pageHead('Portfolio unavailable','This expert is not present in the current snapshot.')+'<a href="#overview">Return to Overview</a>';
 selectedId=x.expert_id;
 const r=researchState(x);
 const warnings=(x.error?'<p class="notice">Account issue: '+esc(x.error)+'</p>':'')+(r.key==='attention'?'<p class="notice">'+esc(r.text)+'. The last saved account and decision remain shown. '+link(expertURL(x.expert_id,'about'),'Review the recorded issue')+'.</p>':'')+(list(x.warnings).length?'<p class="notice">This account has '+x.warnings.length+' saved data warning'+(x.warnings.length===1?'':'s')+'. '+link(expertURL(x.expert_id,'about'),'Review audit details before relying on its valuation')+'.</p>':'');
 const content=route.tab==='holdings'?holdings(x):route.tab==='decisions'?activity(rows,x,true):route.tab==='research'?research(rows,x):about(x);
 return '<div class="expert-head"><div class="top"><div><h1>'+esc(x.name)+'</h1>'+statePill(r)+'</div><a class="inline-link" href="#overview">All portfolios</a></div><p class="method-copy">'+esc(x.description||'Independent investment research and paper portfolio.')+'</p></div><nav class="tabs" aria-label="Expert workspace">'+EXPERT_TABS.map(tab=>'<a class="tab" href="'+expertURL(x.expert_id,tab)+'" data-tab="'+tab+'"'+(route.tab===tab?' aria-current="page"':'')+'>'+tab[0].toUpperCase()+tab.slice(1)+(tab==='holdings'?' <span class="muted">'+list(x.positions).length+'</span>':tab==='decisions'?' <span class="muted">'+list(x.decisions).length+'</span>':'')+'</a>').join('')+'</nav>'+warnings+content;
}
function rememberDetails(){for(const el of document.querySelectorAll('#content details[data-key]')){if(el.open)openDetails.add(el.dataset.key);else openDetails.delete(el.dataset.key);}}
function render(data){
 if(!data)return;
 snapshot=data;const rows=list(data.experts),root=document.getElementById('content'),focused=document.activeElement,focusControl=focused?.dataset?.control,selection=focusControl==='q'?[focused.selectionStart,focused.selectionEnd]:null,focusHref=focused?.tagName==='A'?focused.getAttribute('href'):null,focusDetail=focused?.tagName==='SUMMARY'?focused.parentElement.dataset.key:null,focusButton=focused?.dataset?.sort?'sort':focused?.dataset?.page?'page':focused?.dataset?.holding?'holding':null,focusButtonValue=focusButton?focused.dataset[focusButton]:null;
 rememberDetails();
 root.innerHTML=route.view==='overview'?overview(rows):route.view==='activity'?activity(rows):route.view==='research'?research(rows):expertPage(rows);
 const nav=document.getElementById('expert-nav'),navHtml=rows.map(x=>'<a class="nav-link" href="'+expertURL(x.expert_id)+'"'+(route.view==='expert'&&route.expert===x.expert_id?' aria-current="page"':'')+'>'+esc(x.name)+'</a>').join('');
 if(nav.innerHTML!==navHtml)nav.innerHTML=navHtml;
 for(const a of document.querySelectorAll('[data-nav]')){if(a.dataset.nav===route.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');}
 const current=route.view==='expert'?rows.find(x=>x.expert_id===route.expert)?.name||'Portfolio':route.view[0].toUpperCase()+route.view.slice(1);
 document.title=current+' · Arena · FinRunbook';document.getElementById('breadcrumb').innerHTML='<a href="#overview">Arena</a> <span aria-hidden="true">/</span> <strong>'+esc(current)+'</strong>';
 for(const el of root.querySelectorAll('details[data-key]'))if(openDetails.has(el.dataset.key))el.open=true;
 let replacement;
 if(focusControl)replacement=root.querySelector('[data-control="'+focusControl+'"]');
 else if(focusDetail)replacement=[...root.querySelectorAll('details[data-key]')].find(el=>el.dataset.key===focusDetail)?.querySelector('summary');
 else if(focusButton)replacement=[...root.querySelectorAll('[data-'+focusButton+']')].find(el=>el.dataset[focusButton]===focusButtonValue);
 else if(focusHref)replacement=[...root.querySelectorAll('a')].find(el=>el.getAttribute('href')===focusHref);
 if(replacement){replacement.focus({preventScroll:true});if(selection&&replacement.setSelectionRange)replacement.setSelectionRange(...selection);}
 updateConnection();
}
function updateConnection(){
 const age=snapshot?(Date.now()-Date.parse(snapshot.generated_at))/60000:NaN;
 const fresh=document.getElementById('freshness');fresh.classList.toggle('aged',age>10||!!snapshotError||scheduleErrors.length>0);
 document.getElementById('meta').textContent=snapshot?'Updated '+shortWhen(snapshot.generated_at):snapshotError?'Data unavailable':'Loading portfolios…';
 document.getElementById('error').textContent=[snapshotError,scheduleErrors.length?'Research status update unavailable; the last recorded state remains visible.':''].filter(Boolean).join(' ');
 document.getElementById('freshness-panel').innerHTML='<strong>Saved data</strong><p>Portfolio saved: '+esc(when(snapshot?.generated_at))+'<br>Last checked: '+esc(when(lastCheck))+'</p>'+(age>10?'<p class="notice">Snapshot is '+Math.floor(age)+' minutes old. Each price retains its observation time.</p>':'')+'<p>Prices are completed-minute observations, not live quotes. This page checks for saved updates every 15 seconds; it does not fetch market prices or start research.</p><p>Research states describe saved records. Current process activity is unknown.</p><p><a href="portfolio.json">Portfolio data (JSON)</a></p><details data-key="data-limits"><summary>Data limitations</summary><pre>'+esc(JSON.stringify(snapshot?.limitations||[],null,2))+'</pre></details><button id="refresh"'+(loading?' disabled':'')+'>Check for updates</button>';
}
async function readSaved(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);return await response.json();}finally{clearTimeout(timer);}}
async function load(){
 if(loading)return;loading=true;
 try{
  try{const data=await readSaved('portfolio.json');if(data.schema_version!==1||!Array.isArray(data.experts))throw Error('Unsupported format');snapshot=data;snapshotError='';}catch{snapshotError='Portfolio update unavailable. Displayed values, if any, are from the last saved snapshot.';}
  if(snapshot){const urls=[...new Set(list(snapshot.experts).map(x=>x.runtime?.schedule_url).filter(url=>typeof url==='string'&&url&&link(url,'schedule')))];scheduleErrors=[];await Promise.all(urls.map(async url=>{try{const data=await readSaved(url);if(!data.experts||typeof data.experts!=='object')throw Error('Unsupported research state');scheduleCache.set(url,data);}catch{scheduleErrors.push(url);}}));lastCheck=new Date().toISOString();render(snapshot);}else updateConnection();
 }finally{loading=false;const button=document.getElementById('refresh');if(button)button.disabled=false;}
}
document.addEventListener('click',event=>{
 const refresh=event.target.closest('#refresh');if(refresh){load();return;}
 const sort=event.target.closest('[data-sort]');if(sort){navigate({sort:sort.dataset.sort,dir:route.sort===sort.dataset.sort&&route.dir==='asc'?'desc':'asc',page:1},true);return;}
 const page=event.target.closest('[data-page]');if(page&&!page.disabled){navigate({page:Number(page.dataset.page)});return;}
 const why=event.target.closest('[data-holding]');if(why){const detail=document.getElementById(why.dataset.holding);detail.open=!detail.open;why.setAttribute('aria-expanded',detail.open);if(detail.open)openDetails.add(why.dataset.holding);else openDetails.delete(why.dataset.holding);return;}
 const a=event.target.closest('a[href^="#"]');if(a&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey&&event.button===0){event.preventDefault();if(location.hash!==a.getAttribute('href'))history.pushState(null,'',a.getAttribute('href'));readRoute();render(snapshot);window.scrollTo({top:0,behavior:'instant'});}
});
document.addEventListener('input',event=>{if(event.target.dataset.control==='q')navigate({q:event.target.value,page:1},true);});
document.addEventListener('change',event=>{const key=event.target.dataset.control;if(key&&key!=='q')navigate({[key]:event.target.value,page:1},true);});
window.addEventListener('hashchange',()=>{readRoute();render(snapshot);});
window.addEventListener('popstate',()=>{readRoute();render(snapshot);});
readRoute();setInterval(load,15000);load();
</script>
</body></html>

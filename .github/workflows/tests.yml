name: Public research tests

on:
  push:
    paths:
      - 'skills/**'
      - 'plugin/**'
      - 'tests/**'
      - 'examples/**'
      - 'run/README.md'
      - '*.md'
      - '.gitignore'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline public regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
